<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 Trade-Up Calculator</title>
    <link rel="stylesheet" href="tradeup.css">
</head>
<body>
<h1>CS2 Trade-Up Calculator</h1>

<div class="controls">
    <button class="btn" id="runBtn" onclick="runCalculation()">Calculate Trade-ups</button>
    <button class="btn" id="stopBtn" onclick="stopCalculation()" disabled>Stop</button>
    <button class="btn" onclick="refreshData()">Refresh Data</button>
    <button class="btn" onclick="downloadResults()">Download JSON</button>
    <button class="btn" onclick="getSettingsFromUI()">Save Settings</button>
    <button class="btn" onclick="openCollectionsModal()">Collections</button>
</div>

<div class="settings-box">
    <div style="display: flex; gap: 30px; flex-wrap: wrap;">
        <div class="settings-section" style="flex: 1; min-width: 250px;">
            <h4>Rarity (inputs):</h4>
            <div class="filter-chips" id="rarityCheckboxes">
                <label class="chip"><input type="checkbox" value="0"><span>Consumer</span></label>
                <label class="chip"><input type="checkbox" value="1"><span>Industrial</span></label>
                <label class="chip"><input type="checkbox" value="2" checked><span>Mil-Spec</span></label>
                <label class="chip"><input type="checkbox" value="3" checked><span>Restricted</span></label>
                <label class="chip"><input type="checkbox" value="4"><span>Classified</span></label>
                <label class="chip"><input type="checkbox" value="5"><span>Covert</span></label>
            </div>
        </div>
        <div class="settings-section" style="flex: 1; min-width: 250px;">
            <h4>Wear:</h4>
            <div class="filter-chips" id="wearCheckboxes">
                <label class="chip"><input type="checkbox" value="Factory New"><span>FN</span></label>
                <label class="chip"><input type="checkbox" value="Minimal Wear" checked><span>MW</span></label>
                <label class="chip"><input type="checkbox" value="Field-Tested" checked><span>FT</span></label>
                <label class="chip"><input type="checkbox" value="Well-Worn"><span>WW</span></label>
                <label class="chip"><input type="checkbox" value="Battle-Scarred"><span>BS</span></label>
            </div>
        </div>
    </div>
        <div class="settings-section">
            <h4>Calculation Options:</h4>
            <div class="range-group">
                <div class="range-item">
                    <label>Max duplicates: <span id="maxDupValue">3</span></label>
                    <div class="range-input">
                        <input type="range" id="maxDuplicates" min="1" max="10" value="3"
                               oninput="document.getElementById('maxDupValue').textContent=this.value; document.getElementById('maxDupInput').value=this.value">
                        <input type="number" id="maxDupInput" min="1" max="10" value="3"
                               oninput="document.getElementById('maxDuplicates').value=this.value; document.getElementById('maxDupValue').textContent=this.value">
                    </div>
                </div>
                <div class="range-item">
                    <label>Combination limit: <span id="limitValue">10000</span></label>
                    <div class="range-input">
                        <input type="range" id="comboLimit" min="10" max="1000000" step="10" value="10000"
                               oninput="document.getElementById('limitValue').textContent=this.value; document.getElementById('comboLimitInput').value=this.value">
                        <input type="number" id="comboLimitInput" min="10" max="1000000" step="10" value="10000"
                               oninput="document.getElementById('comboLimit').value=this.value; document.getElementById('limitValue').textContent=this.value">
                    </div>
                </div>
            </div>
            <div style="margin-top: 15px; display: flex; gap: 20px; flex-wrap: wrap; align-items: center;">
                <label class="auto-chip" title="Exclude trade-ups where any output item has quantity <= the defined threshold">
                    <input type="checkbox" id="skipLowQuantity">
                    <span>Skip low quantity items (qty ≤</span>
                    <input type="number" id="lowQuantityThreshold" min="0" max="100" value="1" style="width: 55px; height: 18px; margin: 0; background: #0f3460; color: #00d9ff; border: 1px solid #1a4a7a; border-radius: 6px; padding: 0px 4px; font-size: 12px; font-weight: 600; text-align: center;">
                    <span>)</span>
                </label>
                <label class="auto-chip" title="Automatically calculates trade-ups until at least one match is found">
                    <input type="checkbox" id="autoCalc">
                    <span>Auto-calculate (until at least one match is found)</span>
                </label>
            </div>
        </div>
        <div class="settings-section">
            <h4>Exclude Collections:</h4>
            <div id="bannedCollections" class="collections-grid">
            </div>
        </div>

        <div id="collectionPopup" class="collection-popup">See collection items</div>

        <div id="collectionItemsModal" class="collection-items-modal">
            <div class="collection-items-content">
                <div class="collection-items-header">
                    <input type="text" id="collectionSearchInput" placeholder="Search skin or collection..." oninput="onCollectionSearch(this.value)" style="background: #0f3460; color: #eaeaea; border: 1px solid #00d9ff; border-radius: 6px; padding: 8px 12px; font-size: 15px; flex: 1; max-width: 300px;">
                    <select id="collectionItemsSelect" onchange="onCollectionSelectChange(this.value)" style="background: #0f3460; color: #eaeaea; border: 1px solid #00d9ff; border-radius: 6px; padding: 8px 12px; font-size: 15px; flex: 1; max-width: 500px;">
                        <option value="">Select collection...</option>
                    </select>
                    <button class="collection-items-close" onclick="closeCollectionItemsModal()">&times;</button>
                </div>
                <div id="collectionCratesInfo" style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; padding: 10px; background: #0f3460; border-radius: 6px;"></div>
                <div id="collectionItemsList"></div>
            </div>
        </div>
        <div class="settings-section">
            <h4>Parameters:</h4>
        <div class="params-grid">
            <div class="param-item">
                <label>Steam Fee (%):</label>
                <input type="number" id="steamFee" min="0" max="50" step="0.5" value="2">
            </div>
            <div class="param-item">
                <label>Max item price ($):</label>
                <input type="number" id="maxItemPrice" min="1" max="10000" value="100">
            </div>
            <div class="param-item">
                <label>Min item price ($):</label>
                <input type="number" id="minItemPrice" min="0.01" max="100" step="0.01" value="0.2">
            </div>
            <div class="param-item">
                <label>Max contract ($):</label>
                <input type="number" id="maxContractPrice" min="1" max="100000" value="1000">
            </div>
            <div class="param-item">
                <label>Min profit (%):</label>
                <input type="number" id="minProfitability" min="-100" max="1000" step="1" value="110">
            </div>
        </div>
    </div>
</div>
</div>

<div class="status" id="status">
    <div id="statusText">Click Calculate or Refresh Data</div>
    <div class="progress-bar">
        <div class="progress-fill" id="progress"></div>
    </div>
</div>

<div class="results" id="results"></div>

<script src="tradeup.js"></script>
</body>
</html>
